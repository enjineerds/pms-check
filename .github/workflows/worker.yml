name: worker

on:
  pull_request:
    paths: ['app/worker/**', '.github/workflows/worker.yml']
  push:
    branches: [main]
    paths: ['app/worker/**', '.github/workflows/worker.yml']

defaults:
  run:
    working-directory: app/worker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11; npm 10 crashes installing this lockfile.
          node-version: 24
          cache: npm
          cache-dependency-path: app/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
